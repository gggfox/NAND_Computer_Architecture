# Test virtual host for CI. The check script mounts deploy/.htaccess at /var/www/spa/.htaccess.
# `httpd -t` does not read .htaccess files, so the Include line below makes it check the same
# file. A request test then runs the real .htaccess with AllowOverride All.
# The modules the file needs (mod_headers, mod_dir, mod_mime, mod_authz_core) are loaded
# by the stock httpd image config.
<VirtualHost *:80>
  ServerName spa.test
  DocumentRoot /var/www/spa
  <Directory /var/www/spa>
    AllowOverride All
    Require all granted
    Include /var/www/spa/.htaccess
  </Directory>
</VirtualHost>

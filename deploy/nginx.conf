# Dokploy / any nginx. Serve dist/client as the web root.
server {
  listen 80;
  root /usr/share/nginx/html;
  # There is no index.html; without this, `/` would 403 (directory with no index).
  index _shell.html;

  # The service worker and manifest must never be rewritten to the shell, and the worker must
  # always be revalidated so updates reach users.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # The deploy health gate reads the running commit here; never serve a cached copy.
  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown paths get the shell with status 200.
  location / {
    try_files $uri /_shell.html;
  }
}

name: CI

# Branch pushes run only as pull_request runs, so one push does not start two runs (ADR 55).
# Pushes to main still run, and deploy-staging.yml waits for them.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only changes (code == 'false') skip the tests. Skipped jobs still satisfy the required checks.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
            deploy:
              - 'deploy/**'

  # Runs only when deploy/** changes. Not a required check, so a skipped run does not block merges.
  deploy-configs:
    name: deploy configs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: deploy/check/check-configs.sh

  # Job names are required status checks (ADR 35): keep them exactly check, e2e, visual.
  check:
    name: check
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only for the coverage comment below.
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.code != 'false'
        run: pnpm check
      - if: needs.changes.outputs.code == 'false'
        run: pnpm format:check && pnpm spell
      # Runs after a failed check too, as long as the tests got far enough to write a report.
      # Fork PRs get a read-only token, so they skip the comment; the coverage table stays in the log.
      - uses: davelosert/vitest-coverage-report-action@v2
        if: >-
          !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('coverage/coverage-summary.json') != ''
        with:
          vite-config-path: vitest.config.ts

  # Builds the app one time. The e2e and visual jobs download dist/ and only start the preview server.
  build:
    name: build
    needs: changes
    # Fail-safe: only a positive docs-only result skips; a failed changes job still runs everything.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # One runner per Playwright project: run serially on one 2-vCPU runner they hit the 30 min timeout.
  # Pull requests run one Blink and one WebKit touch project. Pushes to main run all six (ADR 55).
  # If build fails, these jobs still start and fail at the download, so the required checks fail too.
  e2e-project:
    name: e2e (${{ matrix.project }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: >-
          ${{ fromJSON(github.event_name == 'push'
          && '["chromium", "firefox", "webkit", "mobile-chrome", "mobile-safari", "tablet-safari"]'
          || '["chromium", "mobile-safari"]') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
      E2E_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pnpm e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The required status check (ADR 35) is named e2e, so this job gathers the matrix into it.
  e2e:
    name: e2e
    if: always()
    needs: e2e-project
    runs-on: ubuntu-latest
    steps:
      - if: contains(fromJSON('["failure", "cancelled"]'), needs.e2e-project.result)
        run: exit 1

  visual:
    name: visual
    needs: [changes, build]
    # Fail-safe: only a positive docs-only result skips; a failed build fails this job at the download.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
      E2E_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pnpm e2e:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: e2e/**/*-snapshots/**
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
